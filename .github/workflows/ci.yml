name: Continuous Integration
permissions:
  contents: read
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Java ${{ matrix.java }} runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: [8, 11, 17, 21, 23]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: |
            ${{ matrix.java }}
            21
      - uses: gradle/actions/setup-gradle@ac396bf1a80af16236baf54bd7330ae21dc6ece5 # v6
      - run: ./scripts/bootstrap-sdk.sh
      - run: ./gradlew --no-daemon spotlessCheck build installDist -PtestJavaVersion=${{ matrix.java }}
      - name: Publish test reports
        if: success() || failure()
        uses: mikepenz/action-junit-report@bccf2e31636835cf0874589931c4116687171386 # v6
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
